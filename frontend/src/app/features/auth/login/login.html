<div class="min-h-screen bg-[#0f1117] flex items-center justify-center px-4">
  <div class="w-full max-w-[360px]">

    <div class="mb-8 text-center">
      <div class="text-lg font-semibold text-white tracking-[-0.3px]">Staff <span class="text-[#4f8ef7]">Management</span></div>
      <p class="text-xs text-[#4f5b6e] mt-2">Sign in to your admin account</p>
    </div>

    <div class="bg-[#161b27] border border-[#1e2535] rounded-xl p-6">

      @if (error) {
        <div class="bg-[#2a1515] border border-[#3d1f1f] text-[#f87171] py-[9px] px-[13px] rounded-lg mb-4 text-xs">
          {{ error }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-medium text-[#4f5b6e] uppercase tracking-[0.5px]">Username</label>
          <input
            formControlName="username"
            autocomplete="username"
            placeholder="admin"
            class="bg-[#0f1117] border border-[#1e2535] rounded-lg py-[9px] px-3 text-[#c8d0dc] text-[13px] outline-none transition-colors duration-150 w-full focus:border-[#4f8ef7]"
            [class.border-red-700]="f['username'].touched && f['username'].invalid" />
          @if (f['username'].touched && f['username'].hasError('required')) {
            <span class="text-[10px] text-[#f87171]">Username is required</span>
          }
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-medium text-[#4f5b6e] uppercase tracking-[0.5px]">Password</label>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="bg-[#0f1117] border border-[#1e2535] rounded-lg py-[9px] px-3 text-[#c8d0dc] text-[13px] outline-none transition-colors duration-150 w-full focus:border-[#4f8ef7]"
            [class.border-red-700]="f['password'].touched && f['password'].invalid" />
          @if (f['password'].touched && f['password'].hasError('required')) {
            <span class="text-[10px] text-[#f87171]">Password is required</span>
          }
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="bg-[#4f8ef7] text-white border-0 py-[10px] px-[18px] rounded-lg text-[13px] font-medium cursor-pointer w-full hover:bg-[#3a7bf0] disabled:opacity-50 disabled:cursor-not-allowed mt-1">
          {{ loading ? 'Signing in...' : 'Sign in' }}
        </button>

      </form>
    </div>

  </div>
</div>
